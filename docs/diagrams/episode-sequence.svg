<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1030" viewBox="0 0 1500 1030">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="none" stroke="#738879" stroke-width="1.3"/></marker></defs>
<rect width="100%" height="100%" fill="#f8faf6"/>
<g font-family="Arial, sans-serif">
<text x="55" y="65" font-size="31" font-weight="700" fill="#193e31">03 / One Paired Experiment</text>
<text x="55" y="102" font-size="17" fill="#62766a">Exact inputs, isolated target state, preserved execution failures</text>
<polyline points="750,280 750,340" fill="none" stroke="#738879" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="395,475 395,535" fill="none" stroke="#738879" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="1105,475 1105,535" fill="none" stroke="#738879" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="395,705 395,770" fill="none" stroke="#738879" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="1105,705 1105,770" fill="none" stroke="#738879" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="70" y="155" width="1360" height="125" rx="14" fill="#eaf3e5" stroke="#d5e1d0" stroke-width="1.5"/>
<text x="92" y="191" font-size="21" font-weight="700" fill="#1b4937">1. Freeze Inputs</text>
<text x="92" y="224" font-size="16" fill="#52695b">Resolve the source profile and UserSim preamble once. Save model identities and catalogue hash.</text>
<text x="92" y="249" font-size="16" fill="#52695b">Reuse the exact rows for both advisor strategies; keep preference overlays labelled.</text>
<rect x="70" y="340" width="1360" height="135" rx="14" fill="#ffffff" stroke="#d5e1d0" stroke-width="1.5"/>
<text x="92" y="376" font-size="21" font-weight="700" fill="#1b4937">2. Start A Fresh Condition</text>
<text x="92" y="409" font-size="16" fill="#52695b">Create an isolated Deep Agents or Fabric runtime, memory workspace and MCP session.</text>
<text x="92" y="434" font-size="16" fill="#52695b">Select concise or clarification-first policy; enable Relay once.</text>
<rect x="70" y="535" width="650" height="170" rx="14" fill="#ffffff" stroke="#d5e1d0" stroke-width="1.5"/>
<text x="92" y="571" font-size="21" font-weight="700" fill="#1b4937">3a. User / Judge / Summary Activation</text>
<text x="92" y="604" font-size="16" fill="#52695b">Forward exact UserSim role messages to the gateway.</text>
<text x="92" y="629" font-size="16" fill="#52695b">Admit each provider call against the shared budget.</text>
<text x="92" y="654" font-size="16" fill="#52695b">Record the response and measured token usage.</text>
<rect x="780" y="535" width="650" height="170" rx="14" fill="#ffffff" stroke="#d5e1d0" stroke-width="1.5"/>
<text x="802" y="571" font-size="21" font-weight="700" fill="#1b4937">3b. Advisor Activation</text>
<text x="802" y="604" font-size="16" fill="#52695b">Send only the latest public learner message to target.</text>
<text x="802" y="629" font-size="16" fill="#52695b">Target performs real MCP lookups and bounded inference.</text>
<text x="802" y="654" font-size="16" fill="#52695b">Return the final public reply to UserSim.</text>
<rect x="70" y="770" width="1360" height="140" rx="14" fill="#eaf3e5" stroke="#d5e1d0" stroke-width="1.5"/>
<text x="92" y="806" font-size="21" font-weight="700" fill="#1b4937">4. Finalize And Inspect</text>
<text x="92" y="839" font-size="16" fill="#52695b">Continue up to three conversation turns; preserve partial outputs, failures and native warnings.</text>
<text x="92" y="864" font-size="16" fill="#52695b">Save the usage ledger and trace evidence. Score saved replies through the local Helix SDK.</text>
<text x="55" y="990" font-size="16" fill="#687d6e">Repeat activation 3 within the bounded loop, then repeat steps 2–4 for the paired strategy.</text></g></svg>