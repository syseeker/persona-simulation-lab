# Merge into the selected executor only after configuring the matching OpenShell
# Helix credential driver. Values are references/paths, never credential bytes.
gateway_credentials:
  gateway_id: persona-lab-openshell
  registration_key_file: REPLACE_WITH_PRIVATE_OWNED_0600_REGISTRATION_KEY_PATH
  profiles:
    lab-preferences:
      workspaces: [persona-lab]
      credential_keys: [LAB_CONTEXT_TOKEN]
      profile_workspace: default
  renewal_mode: gateway
  renewal_interval_seconds: 10
  # This is a required observed operator attestation, not a readiness default.
  credential_refresh_verified: false
