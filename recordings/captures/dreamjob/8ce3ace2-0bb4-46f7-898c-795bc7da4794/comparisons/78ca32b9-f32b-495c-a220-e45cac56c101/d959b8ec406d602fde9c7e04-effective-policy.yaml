version: 1
filesystem_policy:
  include_workdir: false
  read_only:
  - /bin
  - /lib
  - /lib64
  - /usr
  - /opt/lab
  - /opt/hermes
  - /opt/python
  - /etc
  - /proc/self
  - /dev/urandom
  - /var/log
  - /proc
  read_write:
  - /workspace
  - /tmp
  - /dev/null
landlock:
  compatibility: best_effort
network_policies:
  model_bridge:
    name: in-sandbox-model-bridge
    endpoints:
    - host: 127.0.0.1
      port: 18476
      protocol: rest
      enforcement: enforce
      rules:
      - allow:
          method: POST
          path: /v1/chat/completions
    binaries:
    - path: /usr/local/bin/python3.12
    - path: /opt/python/cpython-3.14.0-linux-x86_64-gnu/bin/python3.14
